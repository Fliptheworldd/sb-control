name: iPhone IPA for local signing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/ios-device.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/ios-device.yml'
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build for physical iPhone without signing
        run: flutter build ios --release --no-codesign --dart-define=SB_DEMO=false
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/sideload/Payload/Runner.app
          cd build/ios/sideload
          /usr/bin/zip -qry ../SB-Control-unsigned.ipa Payload
          cd ..
          shasum -a 256 SB-Control-unsigned.ipa > SB-Control-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Control-iPhone-unsigned
          path: |
            build/ios/SB-Control-unsigned.ipa
            build/ios/SB-Control-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
