name: sb_control
description: Native offline BLE companion for Storz & Bickel devices.
publish_to: none
version: 0.4.0+6
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: 5.4.2
  permission_handler: 12.0.1
  device_info_plus: 11.5.0
  shared_preferences: 2.5.3
  cupertino_icons: 1.0.8
  flutter_local_notifications: 19.4.2
  timezone: 0.10.1
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
